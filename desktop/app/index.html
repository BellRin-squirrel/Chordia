<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Chordia</title>
    <link rel="icon" href="icon/Chordia.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/theme_head.js"></script>
    <!-- ★ i18nスクリプトの追加 -->
    <script src="js/i18n.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 data-i18n="Menu.title">Chordia</h1>
            <p class="subtitle" data-i18n="Menu.subtitle">ライブラリをスマートに管理</p>
        </header>

        <main class="grid-menu">
            <button class="card" id="btnAddMusic">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163z" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.add_music">曲を追加</span><span class="desc" data-i18n="Menu.add_music_desc">個別またはスキャン一括登録</span></div>
            </button>
            <button class="card" id="btnManage">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.manage_db">データベースを管理</span><span class="desc" data-i18n="Menu.manage_db_desc">編集・削除・整理</span></div>
            </button>
            <button class="card" id="btnMigration">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                </div>
                <div class="text"><span class="title" data-i18n="Menu.migration">データの引継ぎ</span><span class="desc" data-i18n="Menu.migration_desc">エクスポート・復元(インポート)</span></div>
            </button>
            <button class="card" id="btnIntegrity">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                    </svg>
                </div>
                <div class="text"><span class="title" data-i18n="Menu.integrity">整合性確認</span><span class="desc" data-i18n="Menu.integrity_desc">タグ・音源・不要データの確認</span></div>
            </button>
            <button class="card" id="btnPlayer">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.player">音楽を再生</span><span class="desc" data-i18n="Menu.player_desc">プレイヤーを開く</span></div>
            </button>
            <button class="card" id="btnMobileSync">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.mobile_sync">Mobile版に同期</span><span class="desc" data-i18n="Menu.mobile_sync_desc">セキュアな接続設定</span></div>
            </button>
            <button class="card" id="btnExtensions" onclick="window.location.href='extensions.html'">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 6.087c0-.355.186-.676.401-.959.221-.29.349-.634.349-1.003 0-1.036-1.007-1.875-2.25-1.875s-2.25.84-2.25 1.875c0 .369.128.713.349 1.003.215.283.401.604.401.959v0a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 0-1.5 1.5v2.625c0 .355-.186.676-.401.959C3.879 12.36 3.75 12.704 3.75 13.125c0 1.036 1.007 1.875 2.25 1.875s2.25-.84 2.25-1.875c0-.369-.128-.713-.349-1.003-.215-.283-.401-.604-.401-.959v0c0-.828.672-1.5 1.5-1.5h1.125a1.5 1.5 0 0 1 1.5 1.5v.938c0 .355.186.676.401.959.221.29.349.634.349 1.003 0 1.036 1.007 1.875 2.25 1.875s2.25-.84 2.25-1.875c0-.369-.128-.713-.349-1.003-.215-.283-.401-.604-.401-.959v0a1.5 1.5 0 0 1 1.5 1.5H18a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5h-2.625A1.5 1.5 0 0 1 14.25 6.087Z" />
                    </svg>
                </div>
                <div class="text"><span class="title" data-i18n="Menu.extensions">拡張機能</span><span class="desc" data-i18n="Menu.extensions_desc">DL機能などを管理</span></div>
            </button>
            <button class="card" id="btnSettings">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 1 15 0 7.5 7.5 0 0 1-15 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25V4.5m0 15v2.25m9.75-9.75H19.5m-15 0H2.25m16.121-7.121-1.591 1.591M5.47 18.53l-1.591 1.591m12.242 0 1.591-1.591M5.47 5.47 3.879 3.879" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.settings">設定</span><span class="desc" data-i18n="Menu.settings_desc">アプリの環境設定</span></div>
            </button>
            <button class="card" id="btnInfo">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 1 15 0 7.5 7.5 0 0 1-15 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25V4.5m0 15v2.25m9.75-9.75H19.5m-15 0H2.25m16.121-7.121-1.591 1.591M5.47 18.53l-1.591 1.591m12.242 0 1.591-1.591M5.47 5.47 3.879 3.879" /></svg></div>
                <div class="text"><span class="title" data-i18n="Menu.info">情報</span><span class="desc" data-i18n="Menu.info_desc">ライセンス・バージョン情報</span></div>
            </button>
        </main>
    </div>
    <script src="js/script.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
