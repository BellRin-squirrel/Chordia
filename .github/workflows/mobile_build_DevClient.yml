name: Build Dev Client (iOS & Android Debug)
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./mobile

jobs:
  # ==========================================
  # iOS Dev Clientビルド (Debug)
  # ==========================================
  build_ios_dev:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ★ 正しいモジュールルートに chordia-equalizer.podspec を生成する
      - name: Ensure Expo Local Module and Dependencies
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const modDir = path.resolve("modules/chordia-equalizer");
          const iosDir = path.join(modDir, "ios");
          const androidDir = path.join(modDir, "android");
          if (!fs.existsSync(iosDir)) fs.mkdirSync(iosDir, { recursive: true });
          if (!fs.existsSync(androidDir)) fs.mkdirSync(androidDir, { recursive: true });

          fs.writeFileSync(path.join(modDir, "package.json"), JSON.stringify({
            name: "chordia-equalizer",
            version: "0.1.0",
            main: "index.ts"
          }, null, 2));

          fs.writeFileSync(path.join(modDir, "expo-module.config.json"), JSON.stringify({
            name: "chordia-equalizer",
            platforms: ["apple", "android"],
            apple: { modules: ["ChordiaEqualizerModule"] },
            android: { modules: ["com.bellrin.chordia.equalizer.ChordiaEqualizerModule"] }
          }, null, 2));

          const podspec = `require "json"
          package = JSON.parse(File.read(File.join(__dir__, "package.json")))

          Pod::Spec.new do |s|
            s.name           = "chordia-equalizer"
            s.version        = package["version"]
            s.summary        = "Chordia Equalizer Module"
            s.description    = "Native Equalizer DSP module for Chordia Mobile"
            s.license        = "MIT"
            s.author         = "Chordia"
            s.homepage       = "https://github.com/BellRin-squirrel/Chordia"
            s.platforms      = { :ios => "15.1" }
            s.swift_version  = "5.4"
            s.source         = { :git => "" }
            s.static_framework = true
            s.dependency "ExpoModulesCore"
            s.source_files = "ios/**/*.{h,m,mm,swift,hpp,cpp}"
          end`;

          fs.writeFileSync(path.join(modDir, "chordia-equalizer.podspec"), podspec.trim());
          fs.writeFileSync(path.join(modDir, "ChordiaEqualizer.podspec"), podspec.trim());

          const gradle = `apply plugin: "com.android.library"
          apply plugin: "kotlin-android"

          group = "com.bellrin.chordia.equalizer"
          version = "1.0.0"

          def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
          if (expoModulesCorePlugin.exists()) {
            apply from: expoModulesCorePlugin
            applyKotlinExpoModulesCorePlugin()
          }

          android {
            compileSdkVersion 34
            namespace "com.bellrin.chordia.equalizer"
            defaultConfig { minSdkVersion 24 }

            sourceSets {
              main {
                java.srcDirs += "src/main/java"
                kotlin.srcDirs += "src/main/java"
              }
            }
          }

          dependencies {
            implementation project(":expo-modules-core")
            implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
          }`;
          fs.writeFileSync(path.join(androidDir, "build.gradle"), gradle.trim());

          const mainPkgPath = path.resolve("package.json");
          let pkg = JSON.parse(fs.readFileSync(mainPkgPath, "utf8"));
          if (!pkg.dependencies["chordia-equalizer"]) {
             pkg.dependencies["chordia-equalizer"] = "file:./modules/chordia-equalizer";
             fs.writeFileSync(mainPkgPath, JSON.stringify(pkg, null, 2));
             console.log("Successfully injected chordia-equalizer into main package.json");
          }
          '

      - name: Install dependencies
        run: npm install

      - name: Give permission to prebuild
        run: chmod +x ./node_modules/.bin/expo

      - name: Prebuild (Convert to Native Project)
        run: ./node_modules/.bin/expo prebuild --platform ios --clean --non-interactive

      # ★ Xcode 16 の C++ fmt コンパイル設定を注入
      - name: Configure Podfile for Xcode 16
        run: |
          node -e '
          const fs = require("fs");
          const podfile = "ios/Podfile";
          if (fs.existsSync(podfile)) {
            let content = fs.readFileSync(podfile, "utf8");
            
            const fmtPatch = `
              installer.pods_project.targets.each do |target|
                if target.name == "fmt"
                  target.build_configurations.each do |config|
                    config.build_settings["CLANG_CXX_LANGUAGE_STANDARD"] = "c++17"
                    config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] ||= ["$(inherited)"]
                    config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] << "FMT_USE_CONSTEVAL=0"
                  end
                end
              end
            `;
            if (content.includes("post_install do |installer|") && !content.includes("target.name == \"fmt\"")) {
              content = content.replace("post_install do |installer|", "post_install do |installer|\n" + fmtPatch);
            }
            fs.writeFileSync(podfile, content);
            console.log("Successfully configured ios/Podfile for Xcode 16");
          }
          '

      - name: Install Pods
        run: |
          cd ios
          pod install

      # ★ FMT_STRING マクロを確実に (s) にオーバーライドして consteval エラーを完全解消
      - name: Patch fmt headers for Xcode 16
        run: |
          chmod -R u+w ios/Pods || true
          node -e '
          const fs = require("fs");
          const path = require("path");

          // 1. base.h の FMT_USE_CONSTEVAL を 0 に変更
          const fmtBase = path.resolve("ios/Pods/fmt/include/fmt/base.h");
          if (fs.existsSync(fmtBase)) {
            let content = fs.readFileSync(fmtBase, "utf8");
            content = content.replace(/#\s*define\s+FMT_USE_CONSTEVAL\s+1/g, "#define FMT_USE_CONSTEVAL 0");
            fs.writeFileSync(fmtBase, content);
            console.log("Patched base.h: FMT_USE_CONSTEVAL 0");
          }

          // 2. format.h のマクロ定義を #define FMT_STRING(s) (s) に置換
          const fmtHeader = path.resolve("ios/Pods/fmt/include/fmt/format.h");
          if (fs.existsSync(fmtHeader)) {
            let content = fs.readFileSync(fmtHeader, "utf8");
            content = content.replace(/#\s*define\s+FMT_STRING\s*\([^)]*\)[^\n]*/g, "#define FMT_STRING(s) (s)");
            content += "\n#undef FMT_STRING\n#define FMT_STRING(s) (s)\n";
            fs.writeFileSync(fmtHeader, content);
            console.log("Patched format.h: override FMT_STRING(s) (s)");
          }

          // 3. format-inl.h 内でも format.h 読込直後に FMT_STRING をプレーン文字列に強制上書き
          const fmtInl = path.resolve("ios/Pods/fmt/include/fmt/format-inl.h");
          if (fs.existsSync(fmtInl)) {
            let content = fs.readFileSync(fmtInl, "utf8");
            if (content.includes("#include \"format.h\"")) {
              content = content.replace("#include \"format.h\"", "#include \"format.h\"\n#undef FMT_STRING\n#define FMT_STRING(s) (s)\n");
            } else {
              content = "#undef FMT_STRING\n#define FMT_STRING(s) (s)\n" + content;
            }
            fs.writeFileSync(fmtInl, content);
            console.log("Patched format-inl.h: override FMT_STRING(s) (s)");
          }
          '

      - name: Give execute permission to all shell scripts in node_modules
        run: find node_modules -type f -name "*.sh" -exec chmod +x {} \;

      - name: Configure Node for Xcode Build
        run: |
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Get Workspace Name
        run: |
          PROJECT_NAME=$(ls ios | grep .xcworkspace | sed 's/\.xcworkspace//')
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      # ★ 生ログ保存＆失敗時詳細出力パイプライン
      - name: Make archive for iOS Dev Client (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace "./ios/$PROJECT_NAME.xcworkspace" \
            -scheme "$PROJECT_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "./build/$PROJECT_NAME.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee raw_build.log | xcpretty || {
              echo "========================================================"
              echo "🚨 XCODEBUILD FAILED! TAIL OF RAW BUILD LOG:"
              echo "========================================================"
              tail -n 120 raw_build.log
              echo "========================================================"
              echo "🚨 BUILD FAILURE SUMMARY:"
              echo "========================================================"
              grep -E "(: error: |fatal error:)" raw_build.log | grep -v "Werror=" || true
              exit 1
            }

      - name: Make Payload Folder and Make It IPA file
        run: |
          mkdir Payload
          cp -r "./build/$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app" ./Payload/
          zip -r Chordia-DevClient.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-DevClient-iOS-IPA
          path: mobile/Chordia-DevClient.ipa

  # ==========================================
  # Android Dev Clientビルド (Debug)
  # ==========================================
  build_android_dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Ensure Expo Local Module and Dependencies
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const modDir = path.resolve("modules/chordia-equalizer");
          const androidDir = path.join(modDir, "android");
          const ktDir = path.join(androidDir, "src/main/java/com/bellrin/chordia/equalizer");
          if (!fs.existsSync(ktDir)) fs.mkdirSync(ktDir, { recursive: true });

          fs.writeFileSync(path.join(modDir, "package.json"), JSON.stringify({
            name: "chordia-equalizer",
            version: "0.1.0",
            main: "index.ts"
          }, null, 2));

          fs.writeFileSync(path.join(modDir, "expo-module.config.json"), JSON.stringify({
            name: "chordia-equalizer",
            platforms: ["apple", "android"],
            apple: { modules: ["ChordiaEqualizerModule"] },
            android: { modules: ["com.bellrin.chordia.equalizer.ChordiaEqualizerModule"] }
          }, null, 2));

          const gradle = `apply plugin: "com.android.library"
          apply plugin: "kotlin-android"

          group = "com.bellrin.chordia.equalizer"
          version = "1.0.0"

          def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
          if (expoModulesCorePlugin.exists()) {
            apply from: expoModulesCorePlugin
            applyKotlinExpoModulesCorePlugin()
          }

          android {
            compileSdkVersion 34
            namespace "com.bellrin.chordia.equalizer"
            defaultConfig { minSdkVersion 24 }

            sourceSets {
              main {
                java.srcDirs += "src/main/java"
                kotlin.srcDirs += "src/main/java"
              }
            }
          }

          dependencies {
            implementation project(":expo-modules-core")
            implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
          }`;
          fs.writeFileSync(path.join(androidDir, "build.gradle"), gradle.trim());

          const ktCode = `package com.bellrin.chordia.equalizer

          import android.media.audiofx.Equalizer
          import expo.modules.kotlin.modules.Module
          import expo.modules.kotlin.modules.ModuleDefinition
          import kotlin.math.abs

          public class ChordiaEqualizerModule : Module() {
            private var equalizer: Equalizer? = null
            private var isEQEnabled: Boolean = false
            private var currentPreamp: Double = 0.0
            private var currentGains: List<Double> = List(10) { 0.0 }
            private var lastErrorMessage: String = "None"

            private val targetFrequencies = intArrayOf(
              32000, 64000, 125000, 250000, 500000,
              1000000, 2000000, 4000000, 8000000, 16000000
            )

            override fun definition() = ModuleDefinition {
              Name("ChordiaEqualizer")

              OnCreate {
                initHardwareEqualizer(0)
              }

              Function("initEqualizer") { audioSessionId: Int ->
                initHardwareEqualizer(audioSessionId)
                return@Function true
              }

              Function("setEnabled") { enabled: Boolean ->
                isEQEnabled = enabled
                equalizer?.enabled = enabled
                applyGainsToHardware()
              }

              Function("setBands") { gains: List<Double>, preamp: Double ->
                currentGains = gains
                currentPreamp = preamp
                applyGainsToHardware()
              }

              Function("applySettings") { enabled: Boolean, preamp: Double, gains: List<Double> ->
                isEQEnabled = enabled
                currentPreamp = preamp
                currentGains = gains
                equalizer?.enabled = enabled
                applyGainsToHardware()
              }

              Function("getDebugInfo") {
                val eq = equalizer
                mapOf(
                  "platform" to "Android",
                  "isNativeConnected" to (eq != null),
                  "isEQEnabled" to isEQEnabled,
                  "numBands" to (eq?.numberOfBands?.toInt() ?: 0),
                  "preamp" to currentPreamp,
                  "gains" to currentGains,
                  "lastError" to lastErrorMessage
                )
              }

              Function("loadAndPlay") { _: String, _: Double, _: Boolean -> false }
              Function("pause") { false }
              Function("play") { false }
              Function("stop") { false }
              Function("seekTo") { _: Double -> false }
              Function("getPosition") { 0.0 }
              Function("getDuration") { 0.0 }
              Function("isPlaying") { false }
            }

            private fun initHardwareEqualizer(sessionId: Int) {
              try {
                equalizer?.release()
                val sid = if (sessionId > 0) sessionId else 0
                equalizer = Equalizer(1000, sid).apply {
                  enabled = isEQEnabled
                }
                applyGainsToHardware()
                lastErrorMessage = "None (Initialized successfully)"
              } catch (e: Exception) {
                lastErrorMessage = e.message ?: "Equalizer init error"
              }
            }

            private fun applyGainsToHardware() {
              val eq = equalizer ?: return
              try {
                eq.enabled = isEQEnabled
                if (!isEQEnabled) return

                val numBands = eq.numberOfBands.toInt()
                val bandRange = eq.bandLevelRange
                val minLevel = bandRange[0]
                val maxLevel = bandRange[1]

                for (b in 0 until numBands) {
                  val centerFreq = eq.getCenterFreq(b.toShort())

                  var bestIdx = 0
                  var minDiff = abs(centerFreq - targetFrequencies[0])
                  for (i in 1 until targetFrequencies.size) {
                    val diff = abs(centerFreq - targetFrequencies[i])
                    if (diff < minDiff) {
                      minDiff = diff
                      bestIdx = i
                    }
                  }

                  val gainDb = (currentGains.getOrNull(bestIdx) ?: 0.0) + currentPreamp
                  val levelMb = (gainDb * 100.0).toInt().coerceIn(minLevel.toInt(), maxLevel.toInt()).toShort()
                  eq.setBandLevel(b.toShort(), levelMb)
                }
              } catch (e: Exception) {
                lastErrorMessage = e.message ?: "Apply gains error"
              }
            }
          }
          `;
          fs.writeFileSync(path.join(ktDir, "ChordiaEqualizerModule.kt"), ktCode.trim());

          const mainPkgPath = path.resolve("package.json");
          let pkg = JSON.parse(fs.readFileSync(mainPkgPath, "utf8"));
          if (!pkg.dependencies["chordia-equalizer"]) {
             pkg.dependencies["chordia-equalizer"] = "file:./modules/chordia-equalizer";
             fs.writeFileSync(mainPkgPath, JSON.stringify(pkg, null, 2));
             console.log("Successfully injected chordia-equalizer into main package.json");
          }
          '

      - name: Install dependencies
        run: |
          rm -rf node_modules/react-native-track-player
          npm install

      - name: Give permission to prebuild
        run: chmod +x ./node_modules/.bin/expo

      - name: Patch react-native-track-player for Kotlin 2.x & New Architecture
        run: |
          node -e '
          const fs = require("fs");
          const file = "node_modules/react-native-track-player/android/src/main/java/com/doublesymmetry/trackplayer/module/MusicModule.kt";
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, "utf8");
            content = content.split("Arguments.fromBundle(").join("fromBundleSafe(");
            if (!content.includes("fun fromBundleSafe")) {
              const lastBraceIndex = content.lastIndexOf("}");
              if (lastBraceIndex !== -1) {
                const helper = `\n    private fun fromBundleSafe(bundle: android.os.Bundle?): com.facebook.react.bridge.WritableMap {\n        return if (bundle != null) com.facebook.react.bridge.Arguments.fromBundle(bundle) else com.facebook.react.bridge.Arguments.createMap()\n    }\n`;
                content = content.slice(0, lastBraceIndex) + helper + content.slice(lastBraceIndex);
              }
            }
            let regex = /@ReactMethod\s+fun\s+[a-zA-Z0-9_]+\s*\([^)]*\)\s*=\s*[a-zA-Z0-9_\.]*launch\s*\{/g;
            let match;
            while ((match = regex.exec(content)) !== null) {
                let startIndex = match.index + match[0].length - 1; 
                let openBraces = 0;
                let endIndex = -1;
                for (let i = startIndex; i < content.length; i++) {
                    if (content[i] === "{") openBraces++;
                    if (content[i] === "}") openBraces--;
                    if (openBraces === 0) { endIndex = i; break; }
                }
                if (endIndex !== -1) {
                    let beforeEq = content.slice(0, match.index + match[0].indexOf("="));
                    let afterEq = content.slice(match.index + match[0].indexOf("=") + 1, endIndex + 1);
                    let afterBlock = content.slice(endIndex + 1);
                    content = beforeEq + "{" + afterEq + "\n    }" + afterBlock;
                    regex.lastIndex = 0;
                }
            }
            fs.writeFileSync(file, content);
          }
          '

      - name: Prebuild (Convert to Native Project)
        run: ./node_modules/.bin/expo prebuild --platform android --clean --non-interactive

      - name: Enable All Architectures for Emulator Support
        run: |
          node -e '
          const fs = require("fs");
          const file = "android/app/build.gradle";
          if (fs.existsSync(file)) {
            let content = fs.readFileSync(file, "utf8");
            if (!content.includes("abiFilters")) {
              content = content.replace(/defaultConfig\s*\{/, "defaultConfig {\n        ndk {\n            abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"\n        }");
              fs.writeFileSync(file, content);
            }
          }
          '

      - name: Increase Gradle Memory Limit & Inject Android 14 ForegroundService
        run: |
          node -e '
          const fs = require("fs");
          const propFile = "android/gradle.properties";
          if (fs.existsSync(propFile)) {
            let content = fs.readFileSync(propFile, "utf8");
            content += "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError\n";
            content += "org.gradle.parallel=true\n";
            fs.writeFileSync(propFile, content);
          }
          const manifestFile = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestFile)) {
            let manifest = fs.readFileSync(manifestFile, "utf8");
            if (!manifest.includes("xmlns:tools=")) {
              manifest = manifest.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"");
            }
            if (!manifest.includes("android:foregroundServiceType=\"mediaPlayback\"")) {
              const serviceTag = "<service android:name=\"com.doublesymmetry.trackplayer.service.MusicService\" android:exported=\"true\" android:foregroundServiceType=\"mediaPlayback\" tools:replace=\"android:exported,android:foregroundServiceType\" />";
              manifest = manifest.replace("</application>", "    " + serviceTag + "\n  </application>");
              fs.writeFileSync(manifestFile, manifest);
            }
          }
          '

      - name: Build Android APK (Debug) with Retry
        run: |
          cd android
          chmod +x ./gradlew
          n=0
          until [ "$n" -ge 3 ]
          do
             ./gradlew assembleDebug && break
             n=$((n+1)) 
             echo "⚠️ Gradle download/build failed. Retrying in 10 seconds... ($n/3)"
             sleep 10
          done
          if [ "$n" -ge 3 ]; then
             exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-DevClient-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk