name: Build Release Apps (iOS & Android) v4.0.0
on:
  workflow_dispatch: # 手動実行ボタンを有効化

# ★重要★
# コマンド (run) がすべて `Mobile` ディレクトリ内で実行されるようにする
defaults:
  run:
    working-directory: ./Mobile

jobs:
  # ==========================================
  # iOSビルド (既存のコードをMobile対応に修正)
  # ==========================================
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Give permission to prebuild
        run: chmod +x ./node_modules/.bin/expo

      - name: Prebuild (Convert to Native Project)
        run: ./node_modules/.bin/expo prebuild --platform ios --clean --non-interactive

      - name: Give execute permission to all shell scripts in node_modules
        run: |
          find node_modules -type f -name "*.sh" -exec chmod +x {} \;

      - name: Configure Node for Xcode Build
        run: |
          NODE_PATH=$(which node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "Configured local xcode env with node path:"
          cat ios/.xcode.env.local

      - name: Get Workspace Name
        run: |
          PROJECT_NAME=$(ls ios | grep .xcworkspace | sed 's/\.xcworkspace//')
          echo "Found project: $PROJECT_NAME"
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Make archive as for iPhones. (Unsigned)
        run: |
          xcodebuild -workspace "./ios/$PROJECT_NAME.xcworkspace" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "./build/$PROJECT_NAME.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee build.log

      - name: Make Payload Folder and Make It IPA file
        run: |
          mkdir Payload
          cp -r "./build/$PROJECT_NAME.xcarchive/Products/Applications/$PROJECT_NAME.app" ./Payload/
          zip -r Chordia.ipa Payload

      # ★注意: upload-artifactはworking-directoryの影響を受けないため、Mobile/ を付与する
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-iOS-IPA
          path: Mobile/Chordia.ipa
          
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: Mobile/build.log

  # ==========================================
  # Androidビルド (新規追加)
  # ==========================================
  build_android:
    runs-on: ubuntu-latest # AndroidビルドはLinux(Ubuntu)の方が高速で安定しています

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # AndroidビルドにはJavaが必要です (React Native 0.73以降はJava 17推奨)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Give permission to prebuild
        run: chmod +x ./node_modules/.bin/expo

      # Android用にPrebuildを実行
      - name: Prebuild (Convert to Native Project)
        run: ./node_modules/.bin/expo prebuild --platform android --clean --non-interactive

      # Gradleを使用してRelease用APKをビルド
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # 生成されたAPKをアップロード
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-Android-APK
          # Expo prebuildで生成されるデフォルトのAPK出力先パス
          path: Mobile/android/app/build/outputs/apk/release/app-release.apk