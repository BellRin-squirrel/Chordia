name: Build Chordia Artifacts by BellRin

on:
  workflow_dispatch: # 手動実行用

defaults:
  run:
    working-directory: ./desktop

jobs:
  build_windows_latest:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app (Windows)
        run: cargo tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-Windows
          path: |
            src-tauri/target/release/Chordia.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
  
  build_macos_latest:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Macの場合は、IntelとApple Silicon両方のターゲットを追加する
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app (Mac - Universal)
        run: cargo tauri build --target universal-apple-darwin

      - name: Compress Mac .app to tar.gz
        run: |
          # tar -czf src-tauri/target/universal-apple-darwin/release/bundle/macos/Chordia_app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macosChordia.app

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chordia-Mac
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Chordia_app.tar.gz
